name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: forge build (ABI check and anvil integration tests read the artifacts)
        run: forge build
        working-directory: contracts
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  sol:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - run: forge fmt --check
      - run: forge build --sizes
      - name: forge test (fork tests skip unless BSC_RPC_URL is set)
        run: forge test -vv
        env:
          BSC_RPC_URL: ${{ secrets.BSC_RPC_URL }}

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: pnpm exec playwright install --with-deps chromium
      - name: Playwright, desktop and phone, mocked API
        run: pnpm e2e

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build the one-service image (keeper + site)
        run: docker build --build-arg PUBLIC_URL=http://localhost:8787 -t rungs .
      - name: start it with no pool configured (coming soon, no chain reads)
        run: docker run -d --name rungs -p 8787:8787 rungs
      - name: wait for the keeper
        run: for i in $(seq 1 30); do curl -sf http://localhost:8787/v1/public/site && exit 0; sleep 2; done; docker logs rungs; exit 1
      - name: the page, a page route, llms.txt and skill.md are served
        run: |
          curl -sf http://localhost:8787/ | grep -q '<div id="root">'
          curl -sf http://localhost:8787/line/0x70997970C51812dc3A010C7d01b50e0d17dc79C8 | grep -q '<div id="root">'
          curl -sf http://localhost:8787/llms.txt | grep -q Rungs
          curl -sf http://localhost:8787/skill.md | grep -q Rungs
          curl -s http://localhost:8787/v1/public/site | grep -q comingSoon
      - if: always()
        run: docker logs rungs || true
