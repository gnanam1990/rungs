[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.26"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
]
fs_permissions = [
  { access = "read", path = "../docs/build-pack/08-reference/schemas" },
  { access = "read", path = "./out" },
]

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 100
fail_on_revert = false
show_metrics = true

[fmt]
line_length = 110
